services:
  dotnet.dapper.postgres.api:
    image: dotnet.dapper.postgres.api
    build:
      context: .
      dockerfile: Dotnet.Dapper.Postgres.Api/Dockerfile
    ports:
        - "8080:8080"
        - "8081:8081"
    
  dotnet.dapper.postgres.db:
      image: postgres:latest
      container_name: users.database
      environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: mydb
      ports:
        - "5432:5432"
